name: Build desktop app

# Builds the standalone Meeting Note Taker app on real Windows and macOS
# runners and uploads the results as downloadable artifacts. Runs on every
# push to the feature branch, on manual dispatch, and publishes a GitHub
# Release with the binaries when you push a version tag (e.g. v1.0.0).

on:
  push:
    branches:
      - claude/desktop-note-recorder-app-np9e57
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MeetingNoteTaker-windows
          - os: macos-latest
            artifact: MeetingNoteTaker-macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Bundle a static ffmpeg next to the spec so the built app can record
      # video without a separate install. Best-effort — the build still
      # succeeds (audio/transcript/summary work) if the download fails.
      - name: Bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe

      - name: Bundle ffmpeg (macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: |
          brew install ffmpeg || true
          cp "$(which ffmpeg)" ./ffmpeg || true

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm desktop_app.spec

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # Publish a permanent GitHub Release with both apps. The tag is created by CI
  # itself (from the VERSION file) using the built-in GITHUB_TOKEN, so it works
  # even where local `git push --tags` is blocked. Runs on the feature branch
  # and on any pushed v* tag; every push keeps the release's binaries current.
  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/claude/desktop-note-recorder-app-np9e57' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download built apps
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each app for release
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: artifacts/*.zip
          name: Meeting Note Taker v${{ steps.ver.outputs.version }}
          make_latest: true
          generate_release_notes: false
          body: |
            **Meeting Note Taker — desktop app**

            A floating recorder that hides itself from the meeting's screen share,
            records the screen you pick, and produces a transcript, summary, and
            action items.

            ### Download
            - **Windows** — `MeetingNoteTaker-windows.zip` → unzip → double-click `MeetingNoteTaker.exe`
            - **macOS** — `MeetingNoteTaker-macos.zip` → unzip → open `MeetingNoteTaker.app`

            ffmpeg is bundled in, so video recording works out of the box. Set
            `ANTHROPIC_API_KEY` for the Claude-generated summary.

            > First launch: Windows SmartScreen → *More info → Run anyway*;
            > macOS → right-click the app → *Open* (the app is unsigned).
